<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mt-4">
      <h1>Admin panel</h1>
      <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
    </div>
    <p id="greeting"></p>

    <h2 class="mt-4">All Users</h2>
    <div id="users"></div>

<!-- ====== HÄR BÖRJAR ANSVARSOMRÅDE 2 (böcker admin) ====== -->
<section id="admin-books-section">
  <h2>Böcker (admin)</h2>

  <table id="admin-books-table" border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Titel</th>
        <th>Författare</th>
        <th>Genres</th>
        <th>Skapad</th>
        <th>Publiceringsår</th>
      </tr>
    </thead>
    <tbody id="admin-books-tbody">
      <!-- Rader fylls i via JS -->
    </tbody>
  </table>

  <h3>Skapa ny bok</h3>
  <form id="create-book-form">
    <label>Titel <input type="text" id="book-title" required /></label><br />
    <label>Beskrivning <textarea id="book-description" required></textarea></label><br />
    <label>Författare <input type="text" id="book-author" required /></label><br />
    <label>Genres (kommaseparerat) <input type="text" id="book-genres" placeholder="Fantasy, Äventyr" required /></label><br />
    <label>Bild-URL <input type="text" id="book-image" required /></label><br />
    <label>Publiceringsår <input type="number" id="book-year" required /></label><br />
    <button type="submit">Skapa bok</button>
  </form>

  <p id="admin-books-message"></p>
</section>
<!-- ====== HÄR SLUTAR ANSVARSOMRÅDE 2 ====== -->

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/functions.js"></script>
<script src="js/protected.js"></script>
<script src="js/adminBooks.js"></script>
</body>
</html>
