<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book details — The Reading Room</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="book-list.html" class="site-logo">The Reading <span>Room</span></a>
    <nav>
      <ul class="site-nav">
        <li><a href="book-list.html" class="active">Books</a></li>
        <li><a href="protected.html">Admin</a></li>
        <li><a href="index.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <a href="book-list.html" class="back-link">&larr; Back to all books</a>

    <div id="book-detail">Loading book...</div>

    <section id="review-section">
      <h2>Reviews</h2>
      <div id="review-list"></div>

      <h3>Write a review</h3>
      <form id="create-review-form">
        <label>Name <input type="text" id="review-name" required /></label>
        <label>Rating (1-5) <input type="number" id="review-rating" min="1" max="5" required /></label>
        <label>Review <textarea id="review-content" required></textarea></label>
        <button type="submit">Submit review</button>
      </form>
      <p id="review-message"></p>
    </section>
  </main>

  <script src="js/bookDetail.js"></script>
</body>
</html>
