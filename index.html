<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<header class="site-header">
<a href="book-list.html" class="site-logo">The Reading <span>Room</span></a>
<nav>
<ul class="site-nav">
<li><a href="book-list.html">Books</a></li>
<li><a href="protected.html">Admin</a></li>
<li><a href="index.html" class="active">Login</a></li>
</ul>
</nav>
</header>

<div class="container">
<h1 id="form-title" class="mt-4">Login</h1>

<p id="demo-notice" class="demo-notice" hidden>
Static demo: login needs the Node/MongoDB backend and only works when the app is run locally.
<a href="book-list.html">Browse the books</a> instead.
</p>

<form id="login-form" autocomplete="off">
<div class="mb-3">
<label for="login-username" class="form-label">Username</label>
<input type="text" class="form-control" id="login-username" required>
</div>
<div class="mb-3">
<label for="login-password" class="form-label">Password</label>
<input type="password" class="form-control" id="login-password" required>
</div>
<p id="login-message"></p>
<button id="login-btn" class="btn btn-primary">Login</button>
</form>

<form id="register-form" style="display: none;" autocomplete="off" class="mb-3">
<div class="mb-3">
<label for="register-username" class="form-label">Username</label>
<input type="text" class="form-control" id="register-username" required>
</div>
<div class="mb-3">
<label for="register-password" class="form-label">Password</label>
<input type="password" class="form-control" id="register-password" required>
</div>
<p id="register-message"></p>
<button id="register-btn" class="btn btn-secondary">Register</button>
</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
crossorigin="anonymous"></script>
<script src="js/functions.js"></script>
<script src="js/login.js"></script>
<script>
if (window.location.hostname.endsWith("github.io")) {
document.getElementById("demo-notice").hidden = false;
}
</script>
</body>

</html>
